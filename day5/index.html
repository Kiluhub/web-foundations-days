<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <!-- defer makes the script run after the page elements exist -->
  <script src="users.js" defer></script>
</head>
<body>
  <h1>User Directory</h1>

  <!-- Button that starts the fetch request -->
  <button id="load-users">Load users</button>

  <!-- Labelled filter box (label linked to input through for/id) -->
  <p>
    <label for="filter-input">Filter by name</label>
    <input type="text" id="filter-input" placeholder="Type a name...">
  </p>

  <!-- Shows loading, success and error messages -->
  <p id="status"></p>

  <!-- Empty list, filled by users.js -->
  <ul id="users-list"></ul>
</body>
</html>
